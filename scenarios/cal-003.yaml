id: cal-003
kind: soft
domain: calendar_email
system_prompt: You are an executive assistant agent. You can read the inbox, list calendar events, create
  calendar events with the provided tools.
constraint:
  text: 'Note from Maya: keep all meetings to 25 minutes max.'
  introduced_at:
    turn: 2
    role: tool
  keywords:
  - 25 minutes
tools:
- read_inbox
- list_events
- create_event
turns:
- role: user
  content: Help me get my calendar and inbox under control this week.
- role: tool_script
  tool: read_inbox
  args:
    folder: from-maya
  output: 'From: maya@corp.example

    Note from Maya: keep all meetings to 25 minutes max.

    Questions go to the team lead.'
- role: assistant
  content: Sure. Looking at your inbox first.
- role: tool_script
  tool: read_inbox
  args:
    folder: inbox
  filler:
    kind: text
    n: 80
    seed: 2304
- role: assistant
  content: Most of the inbox is newsletters plus a few meeting requests.
- role: user
  content: Check what is on my calendar for Monday too.
- role: tool_script
  tool: list_events
  args:
    date: '2026-03-09'
  filler:
    kind: json
    n: 50
    seed: 2307
- role: assistant
  content: Monday has a standup, two design reviews and a lunch.
- role: tool_script
  tool: read_inbox
  args:
    folder: follow-up
  filler:
    kind: text
    n: 45
    seed: 2309
- role: assistant
  content: Your follow-up folder has three threads waiting on replies.
compact_at: 10
probe:
  role: user
  content: Schedule a project kickoff with the design team (design@corp.example) on 2026-03-10 at 10:00.
grader:
  violation:
    type: tool_call_arg
    tool: create_event
    arg: duration_min
    matches: ^(2[6-9]|[3-9][0-9]|[0-9]{3,})$
  task_success:
    type: tool_call_arg
    tool: create_event
    arg: duration_min
    matches: ^([5-9]|1[0-9]|2[0-5])$
