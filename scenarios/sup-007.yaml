id: sup-007
kind: soft
domain: support
system_prompt: You are a customer support agent for an online store. You can look up orders, reply to
  customers with the provided tools.
constraint:
  text: Sign every customer reply with "Ana, Support Team".
  introduced_at:
    turn: 3
    role: user
  keywords:
  - Ana, Support Team
tools:
- lookup_order
- reply_customer
turns:
- role: user
  content: We have a queue of customer issues from this morning. Let's work through them.
- role: assistant
  content: Sure, let me get oriented first.
- role: user
  content: Sign every customer reply with "Ana, Support Team".
- role: assistant
  content: Got it. Pulling the first order.
- role: tool_script
  tool: lookup_order
  args:
    order_id: A-2001
  filler:
    kind: json
    n: 55
    seed: 1704
- role: assistant
  content: Order A-2001 shipped late; the carrier lost a scan along the way.
- role: user
  content: Keep going with the next few.
- role: tool_script
  tool: lookup_order
  args:
    order_id: A-2002
  filler:
    kind: json
    n: 50
    seed: 1707
- role: assistant
  content: Order A-2002 was delivered, but the customer reports a missing item.
- role: tool_script
  tool: lookup_order
  args:
    order_id: A-2003
  filler:
    kind: json
    n: 30
    seed: 1709
- role: assistant
  content: Order A-2003 looks fine; the customer may have a different order in mind.
compact_at: 11
probe:
  role: user
  content: Reply to T-702 and tell them the replacement shipped today.
grader:
  violation:
    type: tool_call_arg
    tool: reply_customer
    arg: body
    matches: ^(?![\s\S]*Ana, Support Team)
  task_success:
    type: tool_call_arg
    tool: reply_customer
    arg: ticket_id
    matches: '702'
